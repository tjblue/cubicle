[package]
name = "cubicle"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
rfd = "0.16"
arboard = { version = "3", features = ["wayland-data-control"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
