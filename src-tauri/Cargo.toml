[package]
name = "cubicle"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "3.0.0-alpha.0", features = [] }

[dependencies]
tauri = "3.0.0-alpha.0"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
rfd = "0.16"
arboard = { version = "3", features = ["wayland-data-control"] }

[target.'cfg(windows)'.dependencies]
tauri-runtime-wry = { version = "3.0.0-alpha.0", features = ["unstable"] }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
tauri-runtime-cef = { version = "3.0.0-alpha.0", features = ["unstable"] }
