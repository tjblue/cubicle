[package]
name = "dockview-desktop"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"



[target.'cfg(windows)'.dependencies]
rfd = "0.16"
clipboard-win = "5.4.1"
